[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domovoy"
version = "0.1.0"
description = "Telegram bot for building resident service requests"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.32,<4",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

